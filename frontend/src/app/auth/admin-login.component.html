<div class="admin-shell">
  <div class="admin-box">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#D9600F"/><path d="M12 8h8M13 8c0 3-3 4-3 9a6 6 0 0 0 12 0c0-5-3-6-3-9" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Craftify
    </div>
    <span class="tag">Administrator</span>

    <div class="alert alert-error" *ngIf="error" role="alert">{{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="aem">Email</label>
        <input id="aem" class="input" type="email" formControlName="email" autocomplete="username" [class.invalid]="form.get('email').invalid && form.get('email').touched">
      </div>
      <div class="field">
        <label for="apw">Password</label>
        <input id="apw" class="input" type="password" formControlName="password" autocomplete="current-password" [class.invalid]="form.get('password').invalid && form.get('password').touched">
      </div>
      <button class="btn btn-primary btn-lg btn-block" type="submit" [disabled]="loading">{{ loading ? 'Signing in…' : 'Sign in to admin panel' }}</button>
    </form>
    <p class="foot"><a routerLink="/">← Back to the shop</a></p>
  </div>
</div>
