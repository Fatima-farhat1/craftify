<div class="shell">
  <aside class="panel">
    <h2>Welcome back to Craftify.</h2>
    <p>Pick up where you left off — your favorites, bids and orders are waiting.</p>
    <div class="arches" aria-hidden="true"><span></span><span></span><span></span></div>
  </aside>
  <div class="side">
    <div class="box">
      <h1>Log in</h1>
      <p class="sub">Enter your details to access your account.</p>

      <div class="alert alert-error" *ngIf="error" role="alert">{{ error }}</div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" class="input" type="email" formControlName="email" autocomplete="email" placeholder="you@example.com"
                 [class.invalid]="form.get('email').invalid && form.get('email').touched">
          <span class="error" *ngIf="form.get('email').invalid && form.get('email').touched">Please enter a valid email.</span>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw">
            <input id="password" class="input" [type]="showPassword ? 'text' : 'password'" formControlName="password" autocomplete="current-password"
                   [class.invalid]="form.get('password').invalid && form.get('password').touched">
            <button type="button" (click)="showPassword = !showPassword">{{ showPassword ? 'Hide' : 'Show' }}</button>
          </div>
          <span class="error" *ngIf="form.get('password').invalid && form.get('password').touched">Password is required.</span>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit" [disabled]="loading">{{ loading ? 'Logging in…' : 'Log in' }}</button>
      </form>

      <p class="foot">New to Craftify? <a routerLink="/register" [queryParams]="returnUrl ? { returnUrl: returnUrl } : {}">Create an account</a></p>
    </div>
  </div>
</div>
